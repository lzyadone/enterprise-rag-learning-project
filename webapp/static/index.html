<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Enterprise RAG Workbench</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div>
          <h1>企业级 RAG 调试工作台</h1>
          <p id="statusLine">loading status...</p>
        </div>
        <div class="top-actions">
          <button id="newSessionBtn" class="ghost" type="button">新会话</button>
          <button id="clearMemoryBtn" class="ghost danger" type="button">清空长期记忆</button>
        </div>
      </header>

      <main class="layout">
        <section class="query-panel">
          <label class="field">
            <span>问题</span>
            <textarea id="queryInput" rows="8">文档切分为什么不能只用固定窗口？</textarea>
          </label>

          <div class="control-grid">
            <label class="field">
              <span>生成模型</span>
              <select id="llmProvider">
                <option value="deepseek">DeepSeek</option>
                <option value="ollama">Ollama</option>
              </select>
            </label>
            <label class="field">
              <span>问题处理</span>
              <select id="retrievalMode">
                <option value="planned">planned</option>
                <option value="direct">direct</option>
              </select>
            </label>
            <label class="field">
              <span>检索通道</span>
              <select id="retrievalStrategy">
                <option value="hybrid">hybrid</option>
                <option value="dense">dense</option>
              </select>
            </label>
            <label class="field">
              <span>重排</span>
              <select id="rerankMode">
                <option value="lexical">lexical</option>
                <option value="none">none</option>
              </select>
            </label>
            <label class="field">
              <span>top_k</span>
              <input id="topK" type="number" min="1" max="10" value="7" />
            </label>
            <label class="field">
              <span>candidate_k</span>
              <input id="candidateK" type="number" min="3" max="30" value="16" />
            </label>
            <label class="field">
              <span>上下文上限</span>
              <input id="maxContextChars" type="number" min="2000" max="20000" step="500" value="9000" />
            </label>
          </div>

          <div class="checks">
            <label><input id="useMemory" type="checkbox" checked /> 对话记忆</label>
            <label><input id="useLongMemory" type="checkbox" checked /> 长期记忆</label>
            <label><input id="auditAnswer" type="checkbox" checked /> 答案审计</label>
          </div>

          <button id="askBtn" class="primary" type="button">运行 RAG</button>
          <div id="errorBox" class="error" hidden></div>
        </section>

        <section class="answer-panel">
          <div class="panel-head">
            <h2>答案与本轮效果</h2>
            <span id="timingText"></span>
          </div>
          <div id="effectSummary" class="effect-summary">
            <div class="empty-state">运行一次问题后，这里会显示检索、上下文、生成和审计效果。</div>
          </div>
          <pre id="answerBox" class="answer-box">等待提问。</pre>
        </section>

        <section class="inspect-panel">
          <div class="tabs" role="tablist">
            <button class="tab active" data-tab="plan" type="button">规划</button>
            <button class="tab" data-tab="sources" type="button">来源</button>
            <button class="tab" data-tab="context" type="button">上下文</button>
            <button class="tab" data-tab="audit" type="button">审计</button>
            <button class="tab" data-tab="memory" type="button">记忆</button>
          </div>

          <div id="planTab" class="tab-panel active"></div>
          <div id="sourcesTab" class="tab-panel"></div>
          <div id="contextTab" class="tab-panel"></div>
          <div id="auditTab" class="tab-panel"></div>
          <div id="memoryTab" class="tab-panel"></div>
        </section>
      </main>
    </div>
    <script src="/app.js"></script>
  </body>
</html>
